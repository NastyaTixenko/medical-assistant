<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Медицинский ассистент</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Кабинет врача</h1>

        <!-- Форма входа -->
        <div id="auth-section">
            <h2>Вход / Регистрация</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <div class="buttons">
                <button id="login-btn">Войти</button>
                <button id="signup-btn">Зарегистрироваться</button>
            </div>
            <p id="auth-message" style="color: red;"></p>
        </div>

        <!-- Рабочее место врача -->
        <div id="app-section" style="display: none;">
            <div class="header-info">
                <p>Врач: <span id="user-email"></span></p>
                <button id="logout-btn">Выйти</button>
            </div>

            <h3>Список пациентов</h3>
            
            <!-- Таблица пациентов -->
            <table id="patients-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Жалобы</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="patients-list">
                    <!-- Сюда будут загружаться пациенты -->
                </tbody>
            </table>

            <!-- Форма добавления пациента -->
            <div class="add-patient-form">
                <h4>Добавить пациента</h4>
                <input type="text" id="p-name" placeholder="ФИО пациента">
                <input type="text" id="p-symptoms" placeholder="Основные жалобы (симптомы)">
                <button id="add-patient-btn">Добавить в базу</button>
            </div>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩИЙ ЧАТ-АССИСТЕНТ -->
    <div id="chat-widget">
        <button id="chat-toggle-btn">💬</button>
        
        <div id="chat-window" class="hidden">
            <div class="chat-header">
                <span>ИИ Ассистент</span>
                <button id="close-chat-btn">✖</button>
            </div>
            <div id="chat-messages">
                <div class="message bot-message">Здравствуйте, доктор! Я могу помочь вам с предварительной оценкой симптомов. Задайте вопрос по пациенту.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Задайте вопрос...">
                <button id="send-msg-btn">➤</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
