<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кабинет врача</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="main-title">Кабинет врача</h1>

        <!-- ФОРМА ВХОДА -->
        <div id="auth-section">
            <h2>Вход / Регистрация</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <div class="buttons">
                <button id="login-btn">Войти</button>
                <button id="signup-btn">Зарегистрироваться</button>
            </div>
            <p id="auth-message" style="color: red;"></p>
        </div>

        <!-- РАБОЧАЯ ОБЛАСТЬ (Появляется после входа) -->
        <div id="app-section" style="display: none;">
            
            <!-- Навигация по вкладкам -->
            <div class="tabs">
                <button class="tab-btn active" data-target="tab-patients">👨‍⚕️ Пациенты</button>
                <button class="tab-btn" data-target="tab-profile">👤 Мой профиль</button>
            </div>

            <!-- ВКЛАДКА 1: ПАЦИЕНТЫ -->
            <div id="tab-patients" class="tab-content active-content">
                <h3>База пациентов</h3>
                <div class="table-responsive">
                    <table id="patients-table">
                        <thead>
                            <tr>
                                <th>ФИО</th>
                                <th>СНИЛС</th>
                                <th>Дата рожд.</th>
                                <th>Жалобы</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="patients-list"></tbody>
                    </table>
                </div>

                <div class="add-patient-form">
                    <h4>Добавить пациента</h4>
                    <input type="text" id="p-name" placeholder="ФИО пациента">
                    <div class="input-row">
                        <input type="text" id="p-snils" placeholder="СНИЛС">
                        <input type="date" id="p-dob">
                    </div>
                    <input type="text" id="p-symptoms" placeholder="Жалобы (симптомы)">
                    <button id="add-patient-btn" class="save-btn">Добавить в базу</button>
                </div>
            </div>

            <!-- ВКЛАДКА 2: ПРОФИЛЬ ВРАЧА -->
            <div id="tab-profile" class="tab-content">
                <div class="profile-header">
                    <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png" alt="Фото врача" class="avatar">
                    <h3 id="profile-name-display">Загрузка...</h3>
                    <p class="reg-date">В системе с: <span id="reg-date">...</span></p>
                </div>

                <div class="profile-form">
                    <label>Ваше ФИО</label>
                    <input type="text" id="d-fullname" placeholder="Иванов Иван Иванович">
                    
                    <label>Номер телефона</label>
                    <input type="tel" id="d-phone" placeholder="+7 (999) 123-45-67">
                    
                    <label>Стаж работы</label>
                    <input type="text" id="d-experience" placeholder="Например: 5 лет">
                    
                    <button id="save-profile-btn" class="save-btn">💾 Сохранить изменения</button>
                    <p id="profile-status" style="color: green; font-size: 14px; margin-top: 5px;"></p>
                </div>

                <div class="logout-section">
                    <button id="logout-btn" class="logout-btn">Выйти из аккаунта</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ЧАТ-АССИСТЕНТ (остается без изменений) -->
    <div id="chat-widget">
        <button id="chat-toggle-btn">💬</button>
        <div id="chat-window" class="hidden">
            <div class="chat-header">
                <span>ИИ Ассистент</span>
                <button id="close-chat-btn">✖</button>
            </div>
            <div id="chat-messages">
                <div class="message bot-message">Здравствуйте, доктор! Я вижу вашу базу пациентов. Спросите меня о любом из них.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Задайте вопрос...">
                <button id="send-msg-btn">➤</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
