<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Медицинский ассистент</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Медицинский ассистент</h1>

        <!-- Форма входа -->
        <div id="auth-section">
            <h2>Вход / Регистрация</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <div class="buttons">
                <button id="login-btn">Войти</button>
                <button id="signup-btn">Зарегистрироваться</button>
            </div>
            <p id="auth-message" style="color: red;"></p>
        </div>

        <!-- Личный кабинет с медицинской картой -->
        <div id="app-section" style="display: none;">
            <h2>Медицинская карта</h2>
            <p style="font-size: 14px; color: gray;">Пользователь: <span id="user-email"></span></p>
            
            <input type="text" id="blood-type" placeholder="Группа крови (например, I+)">
            <input type="text" id="allergies" placeholder="Аллергии (например, пенициллин)">
            <input type="text" id="diseases" placeholder="Хронические заболевания">
            
            <button id="save-med-btn" style="width: 100%; margin-bottom: 10px;">Сохранить данные</button>
            <p id="save-status" style="color: green; font-size: 14px; margin-bottom: 10px;"></p>
            
            <button id="logout-btn">Выйти</button>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩИЙ ЧАТ-АССИСТЕНТ -->
    <div id="chat-widget">
        <button id="chat-toggle-btn">💬</button>
        
        <div id="chat-window" class="hidden">
            <div class="chat-header">
                <span>ИИ Ассистент</span>
                <button id="close-chat-btn">✖</button>
            </div>
            <div id="chat-messages">
                <div class="message bot-message">Здравствуйте! Я ваш медицинский ассистент. Чем я могу помочь? Помните, что я не заменяю врача.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Задайте вопрос...">
                <button id="send-msg-btn">➤</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
